name: metal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/metal2/**"
      - "phone/turnip/**"
      - "tools/build-metal-ios.sh"
      - ".github/workflows/metal.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version
          brew install meson ninja glslang bison flex llvm || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q mako pyyaml packaging meson
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.0
      - name: Build Turnip, the metal2vulkan bridge and SweetMetal2.bundle
        run: sh tools/build-metal-ios.sh "$RUNNER_TEMP/metal"
      - uses: actions/upload-artifact@v4
        with:
          name: metal
          path: |
            phone/metal2/out/
            phone/turnip/out/
          retention-days: 30
