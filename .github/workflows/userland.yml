name: userland

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/**"
      - ".github/workflows/userland.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version
      - name: wland (surya)
        run: sh phone/wifi-surya/build.sh
      - name: tools (surya)
        run: sh phone/tools-surya/build.sh
      - name: adspd (surya audio DSP)
        run: sh phone/audio-surya/build.sh
      - name: test app
        run: sh phone/testapp/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: userland
          path: |
            phone/wifi-surya/out/
            phone/tools-surya/out/
            phone/testapp/out/SweetHello.ipa
            phone/audio-surya/out/
          retention-days: 30
